name: Bootstrap full TGF source publication

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/part-*.bin"
      - ".github/workflows/bootstrap-publish.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: tgf-source-bootstrap
  cancel-in-progress: false

jobs:
  publish-source:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/part-*.bin)
          test "${#parts[@]}" -eq 15
          archive="$RUNNER_TEMP/TGF_Revision16.zip"
          cat "${parts[@]}" > "$archive"
          echo "38cf5cebd423b8733d3ab68856baaf081135409b5e021bb5a81eb761bc5ca2ad  $archive" | sha256sum --check
          python3 - "$archive" <<'PY'
          import sys
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          archive = sys.argv[1]
          with ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              names = zf.namelist()
              if not names or any(not name.startswith("TGF/") for name in names):
                  raise SystemExit("All project files must be inside TGF/")
              for name in names:
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
          PY

      - name: Extract project at repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tgf-source"
          unzip -q "$RUNNER_TEMP/TGF_Revision16.zip" -d "$RUNNER_TEMP/tgf-source"
          test -f "$RUNNER_TEMP/tgf-source/TGF/CMakeLists.txt"
          test -f "$RUNNER_TEMP/tgf-source/TGF/TODO.md"
          cp -a "$RUNNER_TEMP/tgf-source/TGF/." .
          chmod -R u+w .
          test -f CMakeLists.txt
          test -f TODO.md
          test -f .github/workflows/ci.yml
          test -f .github/workflows/nightly-benchmarks.yml
          mkdir -p "$RUNNER_TEMP/tgf-workflows"
          cp -a .github/workflows/ci.yml .github/workflows/nightly-benchmarks.yml "$RUNNER_TEMP/tgf-workflows/"
          rm -rf .bootstrap .github/workflows

      - name: Record source publication in the master TODO
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("TODO.md")
          lines = p.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if "P0.1.4.e.7.a" in line and "- [ ]" in line]
          if len(matches) != 1:
              raise SystemExit(f"Expected one unfinished P0.1.4.e.7.a TODO item, found {len(matches)}")
          lines[matches[0]] = lines[matches[0]].replace("- [ ]", "- [x]", 1)
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit the complete project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.hxx' '*.cmake' 'CMakeLists.txt' '*.py' '*.yml' '*.yaml'
          git commit -m "Publish complete TGF source, CI, documentation, and master TODO"
          git push origin HEAD:main
