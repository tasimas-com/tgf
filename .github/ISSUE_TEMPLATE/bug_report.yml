name: Bug report
description: Report a reproducible defect in TGF.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include passwords, tokens, private user data,
        or unreleased security vulnerabilities in this public form.
  - type: input
    id: summary
    attributes:
      label: What is broken?
      description: A short, specific description of the defect.
      placeholder: The allocator reports an incorrect live allocation count.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TGF revision
      description: Release/tag or commit SHA. Use "main at <date>" if no revision is available.
      placeholder: 597887791105638b7b7202ace314bf1af0141596
    validations:
      required: true
  - type: dropdown
    id: configuration
    attributes:
      label: Build configuration
      options:
        - Debug
        - Release
        - RelWithDebInfo
        - Profiling
        - Sanitizer
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/version, compiler/toolset/version, CMake version, generator, and relevant hardware.
      placeholder: Windows 11; MSVC 19.50; CMake 3.31; Ninja
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest ordered sequence that reliably demonstrates the defect.
      placeholder: |
        1. Configure with ...
        2. Build target ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead? Include the complete relevant error message.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction or relevant log
      description: Paste a small code sample or relevant log. Redact secrets, local usernames, and private paths.
      render: text
    validations:
      required: false
  - type: dropdown
    id: regression
    attributes:
      label: Is this a regression?
      options:
        - "Yes — a previous revision worked"
        - "No — this has never worked for me"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Related issues, screenshots without private information, or other useful details.
    validations:
      required: false
