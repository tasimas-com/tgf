name: Feature request
description: Propose a capability or improvement for TGF.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. TGF is under active architectural development;
        proposals should explain the user problem and fit with the current project scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation or user need does this proposal address?
      placeholder: As an application developer, I need ...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result from an application's or user's point of view.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe an approach if you have one. It is fine to leave this open.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Other approaches considered and why they do or do not solve the problem.
    validations:
      required: false
  - type: textarea
    id: constraints
    attributes:
      label: Architectural and quality constraints
      description: Consider dependencies, module boundaries, public API/ABI, portability, performance, accessibility, threading, and memory ownership as relevant.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Examples or supporting evidence
      description: Use cases, references, measurements, sketches, or comparable behavior.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope and acceptance criteria
      description: What should be included, and how would we know the change is complete?
    validations:
      required: true
